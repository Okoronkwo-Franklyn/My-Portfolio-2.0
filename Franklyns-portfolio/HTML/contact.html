  </div>
</header>

<main>

  <section class="page-hero wrap">
    <div class="hero-eyebrow">
      <span class="pill-tag"><span class="dot"></span>04 — Contact</span>
    </div>
    <h1 class="hero-headline">Let's<span class="accent"> Talk</span></h1>
    <p class="hero-sub">Have a project, an idea, or just want to say hi? My inbox is open.</p>
  </section>

  <section class="contact-layout wrap">
    <div class="contact-cards">
      <a href="mailto:franklynokoronkwo104@gmail.com" class="contact-card">
        <span>Email</span>
        <strong>franklynokoronkwo104@gmail.com</strong>
      </a>
      <a href="https://github.com/Fizzmedia" target="_blank" class="contact-card">
        <span>GitHub</span>
        <strong>github.com/Fizzmedia</strong>
      </a>
    </div>

    <form class="contact-form" action="https://formsubmit.co/franklynokoronkwo104@gmail.com" method="POST">
      <label>
        <span>Name</span>
        <input type="text" name="name" placeholder="Your name" required>
      </label>
      <label>
        <span>Email</span>
        <input type="email" name="email" placeholder="you@example.com" required>
      </label>
      <label>
        <span>Message</span>
        <textarea rows="5" name="message" placeholder="What are you building?" required></textarea>
      </label>
      <button type="submit" class="btn btn-solid">Send Message <i class="fas fa-arrow-right"></i></button>
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_next" value="https://fizzmedia.github.io/Franklyns-portfolio/">
    </form>
  </section>

  <footer>
    <div class="footer-inner wrap">
      <p>© 2026 Franklyn Okoronkwo</p>
      <div class="footer-socials">
        <a href="https://github.com/Fizzmedia" aria-label="GitHub"><i class="fab fa-github"></i></a>
        <a href="mailto:franklynokoronkwo104@gmail.com" aria-label="Email"><i class="fas fa-envelope"></i></a>
      </div>
    </div>
  </footer>

</main>
